# Magnitor macOS CI/CD.
#
# - Every pull request (and a manual run): build the app (ad hoc signed) and upload it as a
#   workflow artifact. UI tests run locally before pushing, not here.
# - Every push to the `release` branch (e.g. merging master into it): a DRAFT release. The
#   version is the latest published v* tag with its patch number raised by one (v0.1.3 -> v0.1.4; v0.0.1 when there is none yet). The app is
#   built, signed with a Developer ID, notarized and stapled, and the .dmg and .zip are attached
#   to a draft GitHub Release. Each push replaces the pending draft, so there is one, from the
#   newest `release`. Nobody gets it until you press Publish on the draft: the updater reads only
#   published releases. Pushes that change only Markdown or screenshots don't build a draft.
# - A pushed tag like v1.2.0: publish exactly that version at once (for a minor or major bump).
#   Publishing a draft creates its tag too, which GitHub reports as a tag push by you; that
#   release already exists, so the run stops at the `Gate` job instead of building it again.
#
# Release signing: add these repository secrets (Settings > Secrets and variables > Actions):
#   MACOS_DEVELOPER_ID_P12           base64 of a "Developer ID Application" certificate + key (.p12)
#   MACOS_DEVELOPER_ID_P12_PASSWORD  the .p12's password
#   APPLE_ID                         the Apple ID that notarizes
#   APPLE_TEAM_ID                    the 10-character team ID
#   APPLE_APP_PASSWORD               an app-specific password for that Apple ID
#   MACOS_PROVISION_PROFILE          (optional) base64 Developer ID provisioning profile for the
#                                    desktop widget's App Group. Without it, releases leave out
#                                    the widget.
name: macOS

on:
  push:
    branches: [release]
    tags: ['v*']
    # Not evaluated for tag pushes, which always release.
    paths-ignore:
      - '**.md'
      - 'assets/screenshot*.png'
  pull_request:
  workflow_dispatch:

concurrency:
  group: macos-${{ github.ref }}
  cancel-in-progress: ${{ !startsWith(github.ref, 'refs/tags/') }}

permissions:
  contents: read

env:
  # The Exact commit this app builds against. Bump it when you move to a newer Exact.
  EXACT_REF: a54f4234f8452deb46aaca7975f76f26f3f42923
  BUN_VERSION: 1.4.2

jobs:
  build:
    name: Build
    # A push releases instead, and the release builds the app itself.
    if: github.event_name != 'push'
    runs-on: macos-26
    timeout-minutes: 90
    steps:
      - uses: actions/checkout@v5

      - uses: oven-sh/setup-bun@v2
        with:
          bun-version: ${{ env.BUN_VERSION }}

      - name: Cache Cargo downloads and Hermes
        uses: actions/cache@v4
        with:
          path: |
            ~/.cargo/registry/index
            ~/.cargo/registry/cache
            ~/.cargo/git/db
            ~/.cargo/hermes-lean-sys
            ~/.cache/exact
          key: macos-cargo-${{ runner.arch }}-${{ env.EXACT_REF }}
          restore-keys: macos-cargo-${{ runner.arch }}-

      - name: Prepare Exact and Rust
        run: sh .ci/prepare-macos.sh

      - name: Install dependencies
        run: bun install --frozen-lockfile

      - name: Check toolchain
        run: bun "$EXACT/scripts/exact.mjs" setup --check --platform macos
        continue-on-error: true

      - name: Build release app
        id: build
        env:
          EXACT_IDENTITY: '-'
          EXACT_BUILD_NUMBER: ${{ github.run_number }}
        run: |
          bun exact.mjs mac --release --json > "$RUNNER_TEMP/build.json"
          app=$(bun -e '
            const lines = (await Bun.file(process.argv[1]).text()).trim().split("\n");
            const result = JSON.parse(lines.at(-1));
            const path = Object.values(result).find((v) => typeof v === "string" && v.endsWith(".app"));
            if (!path) { console.error(JSON.stringify(result)); process.exit(1); }
            console.log(path);
          ' "$RUNNER_TEMP/build.json")
          echo "Built $app"
          mkdir -p dist-ci
          ditto -c -k --sequesterRsrc --keepParent "$app" "dist-ci/Magnitor-${GITHUB_SHA::7}-macos-adhoc.zip"

      - uses: actions/upload-artifact@v4
        with:
          name: Magnitor-macos-${{ github.sha }}
          path: dist-ci/*.zip
          retention-days: 14

  # Publishing a draft in GitHub's UI creates its tag as the person who pressed Publish, so a
  # tag push starts this workflow again for a release that is already out. Stop that here, on a
  # cheap runner, before the macOS build.
  gate:
    name: Gate
    if: github.event_name == 'push'
    runs-on: ubuntu-latest
    timeout-minutes: 5
    outputs:
      release: ${{ steps.check.outputs.release }}
    steps:
      - id: check
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          if [[ "$GITHUB_REF" == refs/tags/* ]] \
            && [ "$(gh release view "$GITHUB_REF_NAME" --repo "$GITHUB_REPOSITORY" --json isDraft --jq .isDraft 2>/dev/null)" = "false" ]; then
            echo "::notice::$GITHUB_REF_NAME is already published (from a draft this workflow built); nothing to build."
            echo "release=false" >> "$GITHUB_OUTPUT"
          else
            echo "release=true" >> "$GITHUB_OUTPUT"
          fi

  release:
    name: Sign, notarize and publish
    # A push to `release` or of a v* tag (the workflow's only push triggers) whose release isn't out yet.
    needs: gate
    if: needs.gate.outputs.release == 'true'
    runs-on: macos-26
    timeout-minutes: 90
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v5
        with:
          fetch-depth: 0

      - name: Pick the version
        id: version
        run: |
          if [[ "$GITHUB_REF" == refs/tags/v* ]]; then
            tag="$GITHUB_REF_NAME"
          else
            last=$(git tag --list 'v[0-9]*' --sort=-v:refname | head -n 1)
            if [ -z "$last" ]; then
              tag="v0.0.1"
            else
              IFS=. read -r major minor patch <<< "${last#v}"
              tag="v${major}.${minor:-0}.$(( ${patch%%[!0-9]*} + 1 ))"
            fi
          fi
          echo "tag=$tag" >> "$GITHUB_OUTPUT"
          echo "version=${tag#v}" >> "$GITHUB_OUTPUT"
          echo "Releasing $tag"

      - uses: oven-sh/setup-bun@v2
        with:
          bun-version: ${{ env.BUN_VERSION }}

      - name: Cache Cargo downloads and Hermes
        uses: actions/cache@v4
        with:
          path: |
            ~/.cargo/registry/index
            ~/.cargo/registry/cache
            ~/.cargo/git/db
            ~/.cargo/hermes-lean-sys
            ~/.cache/exact
          key: macos-cargo-${{ runner.arch }}-${{ env.EXACT_REF }}
          restore-keys: macos-cargo-${{ runner.arch }}-

      - name: Prepare Exact and Rust
        run: sh .ci/prepare-macos.sh

      - name: Install dependencies
        run: bun install --frozen-lockfile

      - name: Import Developer ID and notary credentials
        env:
          MACOS_DEVELOPER_ID_P12: ${{ secrets.MACOS_DEVELOPER_ID_P12 }}
          MACOS_DEVELOPER_ID_P12_PASSWORD: ${{ secrets.MACOS_DEVELOPER_ID_P12_PASSWORD }}
          APPLE_ID: ${{ secrets.APPLE_ID }}
          APPLE_TEAM_ID: ${{ secrets.APPLE_TEAM_ID }}
          APPLE_APP_PASSWORD: ${{ secrets.APPLE_APP_PASSWORD }}
          MACOS_PROVISION_PROFILE: ${{ secrets.MACOS_PROVISION_PROFILE }}
        run: sh .ci/import-developer-id.sh

      # The desktop widget needs a Developer ID provisioning profile for its App Group. Until
      # MACOS_PROVISION_PROFILE is set, releases ship without the widget. Local builds keep it.
      - name: Leave out the widget (no provisioning profile)
        if: env.EXACT_MAC_PROFILE == ''
        run: |
          bun -e '
            const file = "app.json";
            const manifest = JSON.parse(await Bun.file(file).text());
            delete manifest.widgets;
            await Bun.write(file, JSON.stringify(manifest, null, 2) + "\n");
          '
          echo "::notice::Released without the desktop widget: add the MACOS_PROVISION_PROFILE secret to include it."

      - name: Sign, notarize and package
        env:
          EXACT_BUILD_NUMBER: ${{ github.run_number }}
          EXACT_VERSION: ${{ steps.version.outputs.version }}
          TAG: ${{ steps.version.outputs.tag }}
        run: |
          set -o pipefail
          out=target/dist/magnitor
          if ! bun "$EXACT/scripts/exact.mjs" release . 2>&1 | tee "$RUNNER_TEMP/release.log"; then
            # `exact release` notarizes the app (as a zip) and staples it, then staples the .dmg it
            # builds around it, which was never submitted itself: stapler answers "Record not
            # found" (error 65). With the app notarized and stapled, finish here: sign the .dmg,
            # notarize and staple it, and zip the stapled app.
            xcrun stapler validate "$out/Magnitor.app" || exit 1
            test -f "$out/Magnitor.dmg" || exit 1
            echo "::notice::Finishing the .dmg after exact release (it staples a .dmg it never notarized)."
            codesign --force --sign "$EXACT_DEVELOPER_ID" --timestamp "$out/Magnitor.dmg"
            xcrun notarytool submit "$out/Magnitor.dmg" --keychain-profile "$EXACT_NOTARY_PROFILE" --wait \
              | tee "$RUNNER_TEMP/notary-dmg.log"
            grep -q 'status: Accepted' "$RUNNER_TEMP/notary-dmg.log"
            xcrun stapler staple "$out/Magnitor.dmg"
            rm -f "$out/Magnitor.zip"
            ditto -c -k --sequesterRsrc --keepParent "$out/Magnitor.app" "$out/Magnitor.zip"
            spctl --assess --type execute --verbose=2 "$out/Magnitor.app"
            spctl --assess --type open --context context:primary-signature --verbose=2 "$out/Magnitor.dmg"
          fi
          mkdir -p dist-ci
          cp "$out/Magnitor.dmg" "dist-ci/Magnitor-${TAG}-macos.dmg"
          cp "$out/Magnitor.zip" "dist-ci/Magnitor-${TAG}-macos.zip"
          # Same .dmg under a fixed name, so the README's Download button can link straight to
          # releases/latest/download/Magnitor.dmg. The updater only reads the `-macos.zip`.
          cp "$out/Magnitor.dmg" "dist-ci/Magnitor.dmg"
          ls -la dist-ci

      - name: Publish GitHub Release
        env:
          GH_TOKEN: ${{ github.token }}
          TAG: ${{ steps.version.outputs.tag }}
        # A tag push publishes. A `release` push makes a draft, replacing the draft an earlier push
        # left: a draft has no git tag until it is published, so each push picks the same next
        # version. Publishing a draft creates its tag at the commit it was built from; that tag's
        # push run stops at `gate`.
        run: |
          if [[ "$GITHUB_REF" == refs/tags/* ]]; then
            gh release create "$TAG" dist-ci/* --title "Magnitor $TAG" --generate-notes --verify-tag
          else
            for id in $(gh api "repos/$GITHUB_REPOSITORY/releases" --paginate \
                --jq '.[] | select(.draft and (.name | startswith("Magnitor v"))) | .id'); do
              echo "Replacing an earlier draft ($id)"
              gh api -X DELETE "repos/$GITHUB_REPOSITORY/releases/$id"
            done
            gh release create "$TAG" dist-ci/* --draft --target "$GITHUB_SHA" \
              --title "Magnitor $TAG" --generate-notes
          fi

      - name: Remove signing keychain
        if: always()
        run: |
          if [ -n "${CI_KEYCHAIN:-}" ]; then security delete-keychain "$CI_KEYCHAIN" || true; fi
          rm -rf "$RUNNER_TEMP/signing"
