# Magnitor's measuring: the DataSource that answers app.contract's `usage` and `contents`,
# walking the home folder's directories on a few threads (docs/reference.md, "Rust data
# sources"). app.ts answers the other sources. It is a member of the workspace exact2
# generates from app.json, which also holds the host crates that link it.
[package]
name = "magnitor-data"
version.workspace = true
edition.workspace = true
license.workspace = true
publish = false
workspace = "../.exact/shells"

[lib]
name = "magnitor_data"
crate-type = ["rlib"]

[dependencies]
exact-runner.workspace = true
# Docker's Engine API and simctl answer JSON; already built for exact-runner.
serde_json = "1.0"

# `build.rs` writes the view's shapes as Rust structs (`contract rust`).
[build-dependencies]
contract.workspace = true
