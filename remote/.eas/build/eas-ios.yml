# Magnitor Remote's iOS archive on an EAS worker (Exact's recipes/eas-ios.md): Exact checked out
# at EXACT_REF beside the repository, then `exact.mjs ios --device --archive`, signed with the
# distribution certificate and App Store profile EAS keeps for the app (.ci/sign-ios.sh).
build:
  name: Exact iOS
  steps:
    - eas/checkout
    - run:
        name: Prepare Exact
        command: sh .ci/prepare-native.sh ios
    - eas/install_node_modules
    - eas/resolve_build_config
    - run:
        name: Archive
        id: archive
        outputs: [ipa]
        command: |
          set -eu
          # The signing credentials EAS keeps for this app, as JSON in a file the step alone
          # reads (a quoted heredoc: the shell expands nothing in it, and nothing is printed).
          EAS_CREDENTIALS_DIR=$(mktemp -d)
          cat > "$EAS_CREDENTIALS_DIR/build-credentials.json" <<'EAS_BUILD_CREDENTIALS'
          ${ eas.job.secrets.buildCredentials }
          EAS_BUILD_CREDENTIALS
          export EAS_BUILD_CREDENTIALS_FILE="$EAS_CREDENTIALS_DIR/build-credentials.json"
          bun "$EXACT/scripts/exact.mjs" setup --check --platform ios --device
          export EXACT_BUILD_NUMBER="${ eas.job.version.buildNumber }"
          . .ci/sign-ios.sh
          rm -rf "$EAS_CREDENTIALS_DIR"
          bun exact.mjs ios --device --archive out.ipa --json > artifact.json
          test -f out.ipa
          # Its full path: the upload step doesn't run in remote/, where the archive is.
          set-output ipa "$PWD/out.ipa"
    - eas/upload_artifact:
        inputs:
          type: application-archive
          path: ${ steps.archive.ipa }
